<!doctype html>
<html lang="zh-CN" class="dl-scrollbar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/deyloom-icon.svg" type="image/svg+xml" />
    <title>Deyloom — 统一动效语言</title>
    <script>
      // Set the theme before first paint so the page never flashes.
      (() => {
        try {
          const stored = localStorage.getItem("deyloom-theme");
          const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          const theme = stored === "light" || stored === "dark" ? stored : system;
          document.documentElement.dataset.dlTheme = theme;
        } catch {
          /* first paint falls back to CSS defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
